# Separate workspace: MagicSVM needs newer solana crates (and a newer rustc)
# than the program and its LiteSVM tests.
[workspace]

[package]
name = "rival-river-magicsvm-tests"
version = "0.1.0"
edition = "2021"
publish = false

[dev-dependencies]
anchor-lang = "=1.0.2"
rival_river = { path = "../programs/rival_river", features = ["no-entrypoint"] }
ephemeral-rollups-sdk = { version = "0.16.2", features = ["anchor", "access-control"] }
magicsvm = "0.3.0"
solana-account = "4.3.1"
solana-address = "~2.6.1"
solana-clock = "3"
solana-compute-budget-interface = "3"
solana-instruction = { version = "~3.4.0", features = ["bincode"] }
solana-keypair = "3.1.2"
solana-message = "4.2.4"
solana-signer = "3.0.1"
solana-transaction = { version = "4.1.5", features = ["verify"] }
